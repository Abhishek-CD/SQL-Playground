<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SQL Playground — Real-Time Interactive SQLite Workspace{% endblock %}</title>
    <meta name="description" content="A simple, modern, fully functional real-time SQL Playground executing queries against an isolated SQLite database.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    {% block content %}
    {% endblock %}

    {% block scripts %}
    <script src="{% static 'js/playground.js' %}"></script>
    {% endblock %}
</body>
</html>
